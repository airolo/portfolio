<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Brad — an Information Technology Full-Stack Developer building clean, secure, and scalable systems." />
    <title>Bradley Soloria — Full-Stack Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --loader-bg: #f5f1e8;
        --loader-ink: #161310;
        --loader-accent: #ff4e00;
      }

      html.dark {
        color-scheme: dark;
        --loader-bg: #0f0d0c;
        --loader-ink: #f2ede3;
        --loader-accent: #ff4e00;
      }

      body[data-app-ready='true'] #loading-screen {
        opacity: 0;
        visibility: hidden;
      }

      body[data-app-ready='true'] #root {
        opacity: 1;
      }

      #root {
        opacity: 0;
        transition: opacity 280ms ease;
      }

      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: var(--loader-bg);
        color: var(--loader-ink);
        transition: opacity 900ms ease, visibility 900ms ease;
      }

      .loading-card {
        display: grid;
        place-items: center;
        gap: 1.5rem;
      }

      .loading-mark {
        font: italic 400 clamp(4.5rem, 16vw, 8rem) / 1 'Instrument Serif', Georgia, serif;
      }

      .loading-mark .dot {
        color: var(--loader-accent);
      }

      .loading-ring {
        width: 3rem;
        height: 3rem;
        border: 2px solid currentColor;
        border-color: transparent transparent currentColor currentColor;
        animation: loading-spin 1s linear infinite;
      }

      .loading-copy {
        margin: 0;
        font: 500 0.75rem/1.4 'JetBrains Mono', ui-monospace, monospace;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--loader-ink);
      }

      @keyframes loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-paper text-ink antialiased">
    <div id="loading-screen" role="status" aria-live="polite" aria-label="Loading portfolio">
      <div class="loading-card">
        <div class="loading-mark" aria-hidden="true">B<span class="dot">.</span></div>
        <div class="loading-ring" aria-hidden="true"></div>
        <p class="loading-copy">Loading portfolio</p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      const markAppReady = () => {
        document.body.dataset.appReady = 'true';
      };

      if (document.readyState === 'complete') {
        markAppReady();
      } else {
        window.addEventListener('load', markAppReady, { once: true });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
